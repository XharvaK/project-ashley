name: test-agent-nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  agent-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install agent-service deps
        working-directory: apps/agent-service
        run: npm ci
      - name: Build
        working-directory: apps/agent-service
        run: npm run build
      - name: Start agent
        working-directory: apps/agent-service
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISCORD_OWNER_ID: ${{ secrets.DISCORD_OWNER_ID }}
        run: |
          node dist/index.js &
          sleep 5
      - name: Agent integration scripts
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISCORD_OWNER_ID: ${{ secrets.DISCORD_OWNER_ID }}
        run: |
          node scripts/phase0/test-auto-remember.mjs
          node scripts/phase0/test-correction-guard.mjs
