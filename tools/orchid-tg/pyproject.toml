[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchid-tg"
version = "0.1.0"
description = "Telethon harness for personal Orchid UX study"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.36.0",
  "qrcode[pil]>=7.4",
]

[project.scripts]
orchid-tg = "orchid_tg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchid_tg*"]
